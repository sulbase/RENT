name = "rent"
main = "src/server/index.ts"
workers_dev = true
preview_urls = true
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Landing estática en / y SPA en /app. Sin fallback global: /app/* lo resuelve el Worker.
# El redirect de workers.dev permanece apagado hasta que rent.sulbase.com responda
# y Supabase acepte https://rent.sulbase.com/app (el hash de auth no sobrevive un 301).
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [
  "/api/*",
  "/",
  "/robots.txt",
  "/sitemap.xml",
  "/llms.txt",
  "/icon.svg",
  "/app",
  "/app/*",
  "!/app/assets/*",
  "/dashboard",
  "/properties",
  "/properties/*",
  "/tenants",
  "/tenants/*",
  "/leases",
  "/rent",
  "/maintenance",
  "/messages",
  "/settings",
]

# Zona sulbase.com en la misma cuenta de Cloudflare. El primer deploy de producción
# crea el DNS y el certificado. `wrangler preview` no debe robar este hostname.
[[routes]]
pattern = "rent.sulbase.com"
custom_domain = true

[vars]
DEV_ORGANIZATION_SLUG = "dev"
CANONICAL_REDIRECT = "false"

# Buzón: una pasada diaria a las 13:00 UTC (08:00 en UTC−5). El handler inserta lotes pequeños.
[triggers]
crons = ["0 13 * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true

# Producción: Hyperdrive rent-supabase → pooler 6543, caché de consultas desactivada.
# El string de conexión no va en el repo. En local, scripts/dev-api.mjs inyecta
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE desde DATABASE_POOLED_URL
# (wrangler lo exige en el entorno del proceso, antes de leer .dev.vars).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "6a5f5c4f4d9945a78312490ab24c881a"

# Bucket privado. `wrangler dev` simula el binding en local (preview_bucket_name).
# Crear antes del deploy: `wrangler r2 bucket create rent-files` y `wrangler r2 bucket create rent-files-dev`.
[[r2_buckets]]
binding = "FILES"
bucket_name = "rent-files"
preview_bucket_name = "rent-files-dev"
